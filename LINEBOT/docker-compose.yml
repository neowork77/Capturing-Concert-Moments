services:
  customer-bot:
    build:
      context: ./customer_bot
      dockerfile: Dockerfile
    container_name: linebot-customer
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - RELOAD=false
    env_file:
      - path: ./customer_bot/.env
        required: false
      - path: ./.env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  admin-bot:
    build:
      context: ./admin_bot
      dockerfile: Dockerfile
    container_name: linebot-admin
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - RELOAD=false
    env_file:
      - path: ./admin_bot/.env
        required: false
      - path: ./.env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Optional single-container profile for running both bots together
  all-in-one:
    profiles: ["all"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linebot-all
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      - RELOAD=false
    env_file:
      - path: ./.env
        required: false
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health && curl -f http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

